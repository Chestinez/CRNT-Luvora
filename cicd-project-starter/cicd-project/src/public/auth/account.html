<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Your account · Luvora</title>
    <link rel="stylesheet" href="/auth/auth.css" />
    <script src="/auth/auth.js" defer></script>
  </head>
  <body data-page="account">
    <main class="account-shell">
      <a class="wordmark" href="/auth/signup.html">luvora<span>✳</span></a>
      <section class="account-card" aria-labelledby="account-title">
        <p class="eyebrow">A new chapter</p>
        <h1 id="account-title">You’re in good company.</h1>
        <div id="form-status" class="notice" role="status" tabindex="-1">
          Checking your session…
        </div>
        <div id="account-details" hidden>
          <p class="intro" id="account-greeting"></p>
          <p class="account-email" id="account-email"></p>
          <p>
            Your account is ready. New profiles stay private until profile onboarding is complete.
          </p>
          <a class="primary-button" href="/discovery/"
            >Explore Luvora <span aria-hidden="true">↗</span></a
          >
          <p><a href="/auth/security.html" id="security-state">Account security</a></p>
          <button class="secondary-button" id="logout" type="button">Log out</button>
        </div>
        <noscript><p>Please enable JavaScript to view your account.</p></noscript>
      </section>
    </main>
  </body>
</html>
